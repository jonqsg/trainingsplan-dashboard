<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Training">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#F4F4F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0A0B0E" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Trainingsstand</title>
<style>
  :root {
    --bg:#F4F4F6; --surface:#FFFFFF; --surface-2:#F1F1F4; --ink:#0F1115; --sub:#636874; --faint:#9A9FA9;
    --line:rgba(15,17,21,.07); --line-strong:rgba(15,17,21,.15);
    --accent:#FF5B24; --accent-soft:rgba(255,91,36,.12);
    --good:#16A34A; --warn:#E5484D; --info:#2F80ED;
    --shadow:0 1px 2px rgba(15,17,21,.04), 0 6px 20px rgba(15,17,21,.05);
    --radius:20px;
    --c-rad:#2F80ED; --c-rolle:#7C5CFF; --c-lauf:#FF7A1A; --c-schwimmen:#0FB5C4; --c-kraft:#E0457B; --c-sonstiges:#8A8F98;
    --z1:#A0A6B1; --z2:#3B82F6; --z3:#22C55E; --sst:#EAB308; --thr:#F97316; --vo2:#EF4444; --ana:#A855F7;
    --ctl:#2F80ED; --atl:#E0457B; --sleep:#6366F1; --energy:#0D9488;
    --sans:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#0A0B0E; --surface:#15171C; --surface-2:#1E2128; --ink:#F3F4F6; --sub:#9CA1AC; --faint:#6C717B;
      --line:rgba(255,255,255,.07); --line-strong:rgba(255,255,255,.14);
      --accent-soft:rgba(255,91,36,.18); --shadow:none; --sleep:#818CF8; --energy:#2DD4BF;
    }
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; padding:0; background:var(--bg); color:var(--ink); font-family:var(--sans);
    -webkit-font-smoothing:antialiased; -webkit-user-select:none; user-select:none; }
  input, textarea, select, button { font-family:inherit; font-size:16px; color:inherit; } /* 16px verhindert iOS-Zoom */
  button { cursor:pointer; }
  h1,h2,h3,h4,p { margin:0; }
  .num { font-variant-numeric:tabular-nums; letter-spacing:-.02em; }
  .ic { flex:none; display:block; }

  /* ---------- Layout ---------- */
  .shell { display:flex; min-height:100vh; }
  .main { flex:1; min-width:0; max-width:1180px; margin:0 auto;
    padding:max(14px, env(safe-area-inset-top)) 16px calc(96px + env(safe-area-inset-bottom)); }
  .sidebar { display:none; }
  .tabbar { position:fixed; left:0; right:0; bottom:0; z-index:40; display:flex; justify-content:space-around;
    padding:6px 8px max(8px, env(safe-area-inset-bottom));
    background:color-mix(in srgb, var(--surface) 84%, transparent); backdrop-filter:saturate(1.6) blur(22px);
    -webkit-backdrop-filter:saturate(1.6) blur(22px); border-top:1px solid var(--line); }
  .tab { flex:1; background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:3px;
    padding:6px 0; font-size:11px; font-weight:600; color:var(--faint); }
  .tab.on { color:var(--accent); }
  @media (min-width:900px) {
    .tabbar { display:none; }
    .main { padding:28px 32px 48px; }
    .sidebar { display:flex; flex-direction:column; width:232px; flex:none; position:sticky; top:0; height:100vh;
      padding:24px 14px; border-right:1px solid var(--line); background:var(--surface); }
    .brand { display:flex; align-items:center; gap:10px; font-weight:700; font-size:17px; padding:0 10px 22px; }
    .logo { width:32px; height:32px; border-radius:10px; background:var(--accent); color:#fff; display:grid; place-items:center; }
    .nav { display:flex; align-items:center; gap:12px; width:100%; background:none; border:none; text-align:left;
      padding:10px 12px; border-radius:12px; font-size:15px; font-weight:500; color:var(--sub); margin-bottom:2px; }
    .nav:hover { background:var(--surface-2); }
    .nav.on { background:var(--accent-soft); color:var(--accent); font-weight:600; }
    .side-foot { margin-top:auto; padding:12px; font-size:12px; color:var(--faint); line-height:1.5; }
  }

  /* ---------- Topbar ---------- */
  .topbar { display:flex; justify-content:space-between; align-items:flex-end; gap:12px; margin:6px 0 18px; }
  .eyebrow { font-size:13px; font-weight:600; color:var(--sub); margin-bottom:2px; }
  h1 { font-size:30px; font-weight:750; letter-spacing:-.025em; line-height:1.1; }
  h2 { font-size:17px; font-weight:700; letter-spacing:-.01em; }
  .top-actions { display:flex; gap:8px; align-items:center; }
  .icon-btn { width:40px; height:40px; border-radius:50%; border:1px solid var(--line); background:var(--surface);
    box-shadow:var(--shadow); display:grid; place-items:center; color:var(--ink); position:relative; flex:none; }
  .icon-btn .badge { position:absolute; top:7px; right:7px; width:8px; height:8px; border-radius:50%; border:2px solid var(--surface); }
  .spin .ic, .ic.spin { animation:spin 1s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .hide-sm { display:none; }
  @media (min-width:520px) { .hide-sm { display:inline; } }

  /* ---------- Cards & primitives ---------- */
  .card { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:18px; box-shadow:var(--shadow); }
  .card-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; gap:8px; flex-wrap:wrap; }
  .card-head .grow { flex:1; }
  .stack-v { display:flex; flex-direction:column; gap:14px; }
  .link { background:none; border:none; color:var(--accent); font-weight:600; font-size:14px; display:inline-flex; align-items:center; gap:4px; padding:4px 0; }
  .pill { display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600; padding:5px 10px; border-radius:999px;
    background:var(--surface-2); color:var(--sub); white-space:nowrap; }
  .pill.live { color:var(--good); background:color-mix(in srgb, var(--good) 12%, transparent); }
  .pill.warn { color:var(--warn); background:color-mix(in srgb, var(--warn) 12%, transparent); }
  .pill .dot { width:6px; height:6px; border-radius:50%; background:currentColor; }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; border:none; border-radius:14px;
    background:var(--accent); color:#fff; font-weight:650; font-size:15px; padding:12px 16px; transition:transform .1s, opacity .15s; text-decoration:none; }
  .btn:active { transform:scale(.98); }
  .btn.secondary { background:var(--surface-2); color:var(--ink); }
  .btn.good { background:var(--good); }
  .btn.ghost { background:none; color:var(--sub); }
  .btn.danger { background:none; color:var(--warn); }
  .btn.sm { padding:9px 13px; font-size:14px; border-radius:12px; }
  .btn.xs { padding:6px 10px; font-size:13px; border-radius:10px; }
  .btn.block { width:100%; }
  .btn[disabled] { opacity:.45; pointer-events:none; }
  .tile { width:36px; height:36px; border-radius:11px; display:grid; place-items:center; color:#fff; flex:none; }
  .tile.lg { width:48px; height:48px; border-radius:14px; }
  .zchip { display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:600; padding:2px 8px 2px 6px; border-radius:999px;
    background:color-mix(in srgb, var(--zc) 15%, transparent); color:color-mix(in srgb, var(--zc) 80%, var(--ink)); white-space:nowrap; }
  .zchip::before { content:""; width:7px; height:7px; border-radius:50%; background:var(--zc); }
  .meter { position:relative; height:8px; border-radius:99px; background:var(--surface-2); overflow:hidden; }
  .meter .fill { position:absolute; left:0; top:0; bottom:0; border-radius:99px; background:var(--accent); transition:width .4s; }
  .meter .band { position:absolute; top:0; bottom:0; background:color-mix(in srgb, var(--good) 22%, transparent); }
  .stackbar { display:flex; height:8px; border-radius:99px; overflow:hidden; background:var(--surface-2); gap:2px; }
  .stackbar > i { display:block; height:100%; }
  .legend { display:flex; flex-wrap:wrap; gap:4px 12px; font-size:12px; color:var(--sub); margin-top:8px; }
  .legend span { display:inline-flex; align-items:center; gap:5px; }
  .legend i { width:8px; height:8px; border-radius:50%; display:inline-block; }
  .muted { color:var(--sub); font-size:14px; line-height:1.45; }
  .empty { display:flex; gap:14px; align-items:center; padding:6px 0; }
  .empty .tile { background:var(--surface-2); color:var(--sub); }
  .empty b { font-size:15px; }
  .empty p { font-size:13px; color:var(--sub); margin-top:2px; }
  .hint { display:flex; gap:10px; align-items:flex-start; background:color-mix(in srgb, var(--hc) 12%, transparent); border-radius:14px;
    padding:12px 14px; margin-top:12px; font-size:14px; line-height:1.45; }
  .hint > .ic { color:var(--hc); margin-top:1px; }
  .hint .btn { margin-top:8px; }
  .factors { display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; }
  .factor { font-size:12px; font-weight:600; padding:4px 9px; border-radius:99px; background:var(--surface-2); color:var(--sub); display:inline-flex; gap:4px; align-items:center; }
  .factor b { color:var(--ink); }

  /* ---------- Heute ---------- */
  .today-grid { display:grid; gap:14px; }
  @media (min-width:900px) { .today-grid { grid-template-columns:minmax(300px, 380px) 1fr; align-items:start; } }
  .hero { text-align:center; }
  .hero-top { display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap; }
  .gauge { max-width:260px; margin:6px auto 0; }
  .gauge svg { width:100%; height:auto; display:block; }
  .form-label { font-size:20px; font-weight:750; margin-top:2px; }
  .form-hint { font-size:13px; color:var(--sub); margin:4px auto 16px; max-width:280px; line-height:1.4; }
  .kpis { display:grid; grid-template-columns:repeat(3,1fr); border-top:1px solid var(--line); padding-top:14px; }
  .kpi + .kpi { border-left:1px solid var(--line); }
  .kpi-lbl { font-size:12px; color:var(--sub); font-weight:600; display:flex; align-items:center; justify-content:center; gap:5px; }
  .kpi-lbl i { width:7px; height:7px; border-radius:50%; }
  .kpi-val { font-size:24px; font-weight:750; margin-top:2px; }
  .kpi-delta { font-size:12px; color:var(--faint); font-weight:600; }
  .ready { display:flex; gap:16px; align-items:center; }
  .ring { width:74px; height:74px; flex:none; position:relative; }
  .ring svg { width:100%; height:100%; transform:rotate(-90deg); }
  .ring .rv { position:absolute; inset:0; display:grid; place-items:center; font-weight:750; font-size:22px; }
  .tw { padding:4px 0; }
  .tw + .tw { border-top:1px solid var(--line); margin-top:12px; padding-top:16px; }
  .tw-main { display:flex; gap:14px; align-items:center; width:100%; background:none; border:none; text-align:left; padding:0; }
  .tw-title { font-size:18px; font-weight:700; letter-spacing:-.01em; display:block; }
  .tw-meta { display:flex; flex-wrap:wrap; gap:6px 10px; align-items:center; font-size:13px; color:var(--sub); margin-top:4px; }
  .tw-meta span { display:inline-flex; align-items:center; gap:4px; }
  .tw-goal { font-size:14px; color:var(--sub); line-height:1.45; margin-top:12px;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .tw-actions { display:flex; gap:8px; margin-top:14px; }
  .tw-actions .btn { flex:1; }
  .tw.done .tw-title { text-decoration:line-through; opacity:.55; }
  .erg-mini { margin-top:14px; background:var(--surface-2); border-radius:12px; padding:10px 10px 6px; }
  .erg-mini svg { width:100%; display:block; }
  .strip { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
  .strip-day { background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:4px; padding:6px 0; border-radius:12px; }
  .strip-day .sd-dow { font-size:11px; font-weight:700; color:var(--faint); }
  .strip-day .sd-num { width:32px; height:32px; border-radius:50%; display:grid; place-items:center; font-weight:700; font-size:15px; }
  .strip-day.today .sd-num { background:var(--accent); color:#fff; }
  .strip-day.past .sd-num { color:var(--faint); }
  .sd-dots { display:flex; gap:3px; height:7px; }
  .sd-dots i { width:7px; height:7px; border-radius:50%; border:1.5px solid var(--c); }
  .sd-dots i.f { background:var(--c); }
  .progress-row { display:flex; justify-content:space-between; font-size:13px; color:var(--sub); margin:14px 0 8px; }
  .progress-row b { color:var(--ink); }

  /* ---------- Listen-Zeilen ---------- */
  .rows { display:flex; flex-direction:column; }
  .row-item { display:flex; align-items:center; gap:12px; width:100%; background:none; border:none; text-align:left; padding:10px 0; }
  .row-item + .row-item { border-top:1px solid var(--line); }
  .ri-main { flex:1; min-width:0; }
  .ri-title { font-weight:600; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ri-meta { font-size:13px; color:var(--sub); margin-top:2px; display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .ri-side { text-align:right; font-size:13px; color:var(--sub); flex:none; }
  .ri-side b { display:block; font-size:15px; color:var(--ink); }

  /* ---------- Plan ---------- */
  .toolbar { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:14px; flex-wrap:wrap; }
  .seg { display:inline-flex; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:3px; box-shadow:var(--shadow); }
  .seg button { background:none; border:none; border-radius:9px; padding:7px 10px; font-size:14px; font-weight:600; color:var(--sub); display:flex; align-items:center; gap:4px; }
  .seg button.on { background:var(--surface-2); color:var(--ink); }
  .seg.sm button { padding:5px 9px; font-size:13px; }
  .stats { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:14px; }
  @media (min-width:760px) { .stats { grid-template-columns:repeat(4,1fr); } }
  .stat { padding:14px 16px; }
  .stat-lbl { font-size:12px; font-weight:600; color:var(--sub); }
  .stat-val { font-size:24px; font-weight:750; margin:3px 0 8px; }
  .stat-val small { font-size:14px; color:var(--sub); font-weight:600; margin-left:3px; }
  .stat-foot { font-size:12px; color:var(--sub); margin-top:7px; }
  .lib-row, .chips.scroll { scrollbar-width:none; }
  .lib-row::-webkit-scrollbar, .chips.scroll::-webkit-scrollbar { display:none; }
  .lib-row { display:flex; gap:10px; overflow-x:auto; padding:2px 2px 10px; margin:0 -2px 8px; scroll-snap-type:x proximity; }
  .lib-card { flex:none; width:168px; scroll-snap-align:start; text-align:left; padding:12px; border-radius:16px; cursor:grab; position:relative; }
  .lib-card .t { font-weight:650; font-size:14px; margin-top:8px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .lib-card .m { font-size:12px; color:var(--sub); margin-top:4px; display:flex; gap:6px; align-items:center; }
  .lib-card .del { position:absolute; top:8px; right:8px; width:24px; height:24px; border-radius:50%; border:none; background:var(--surface-2); color:var(--sub); display:grid; place-items:center; padding:0; }
  .week { display:flex; flex-direction:column; gap:10px; }
  .day { display:grid; grid-template-columns:48px 1fr; gap:12px; padding:12px; border-radius:18px; }
  .day.today { border-color:color-mix(in srgb, var(--accent) 55%, transparent); }
  .day.drop { outline:2px dashed var(--accent); outline-offset:-2px; }
  .day-date { text-align:center; padding-top:2px; }
  .dow { font-size:12px; font-weight:700; color:var(--sub); text-transform:uppercase; }
  .dnum { font-size:22px; font-weight:750; }
  .day.today .dnum, .day.today .dow { color:var(--accent); }
  .day-wx { font-size:11px; color:var(--faint); margin-top:4px; display:flex; align-items:center; justify-content:center; gap:3px; }
  .day-body { display:flex; flex-direction:column; gap:8px; min-width:0; }
  .wk { display:flex; align-items:center; gap:10px; background:var(--surface-2); border:none; border-radius:13px; padding:8px 10px;
    text-align:left; width:100%; color:var(--ink); }
  .wk[draggable="true"] { cursor:grab; }
  .wk-main { flex:1; min-width:0; }
  .wk-title { font-weight:650; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .wk-meta { font-size:12px; color:var(--sub); display:flex; align-items:center; gap:6px; margin-top:2px; flex-wrap:wrap; }
  .wk-actual { font-size:11.5px; font-weight:650; display:flex; align-items:center; gap:4px; margin-top:3px; }
  .wk.done .wk-title { text-decoration:line-through; opacity:.55; }
  .wk .tile { width:32px; height:32px; border-radius:10px; }
  .check { width:28px; height:28px; border-radius:50%; border:1.5px solid var(--line-strong); display:grid; place-items:center;
    color:transparent; background:none; flex:none; padding:0; }
  .check.on { background:var(--good); border-color:var(--good); color:#fff; }
  .check.auto { background:color-mix(in srgb, var(--good) 18%, transparent); border-color:var(--good); color:var(--good); }
  .unplanned { font-size:12px; color:var(--sub); display:flex; align-items:center; gap:6px; padding:7px 10px; border-radius:12px; border:1px dashed var(--line-strong); }
  .add-slot { border:1.5px dashed var(--line-strong); border-radius:13px; padding:8px; color:var(--sub); background:none;
    display:flex; align-items:center; justify-content:center; gap:6px; font-size:13px; font-weight:600; }
  .rest { font-size:13px; color:var(--faint); padding:4px 2px; }
  @media (min-width:1180px) {
    .week { display:grid; grid-template-columns:repeat(7, minmax(0,1fr)); gap:10px; }
    .day { grid-template-columns:1fr; align-content:start; min-height:240px; }
    .day-date { text-align:left; display:flex; align-items:baseline; gap:6px; flex-wrap:wrap; }
    .day-wx { width:100%; margin-top:0; justify-content:flex-start; }
    .wk { flex-wrap:wrap; }
    .wk .check { display:none; }
    .wk .tile { width:26px; height:26px; border-radius:8px; }
  }
  .review h4 { font-size:13px; margin:16px 0 6px; display:flex; gap:6px; align-items:center; }
  .review ul { margin:0; padding-left:18px; font-size:14px; line-height:1.5; }
  .review li + li { margin-top:4px; }

  /* ---------- Fortschritt ---------- */
  .chart { width:100%; position:relative; touch-action:pan-y; }
  .chart svg { display:block; }
  .chart-legend { display:flex; flex-wrap:wrap; gap:6px 18px; margin-bottom:12px; align-items:flex-end; }
  .chart-legend > div { display:flex; flex-direction:column; }
  .chart-legend .l { font-size:12px; color:var(--sub); font-weight:600; display:flex; align-items:center; gap:5px; }
  .chart-legend .l i { width:10px; height:3px; border-radius:2px; }
  .chart-legend .v { font-size:20px; font-weight:750; }
  .chart-legend .date { margin-left:auto; font-size:13px; color:var(--faint); font-weight:600; }
  .grid-2 { display:grid; gap:14px; margin-top:14px; }
  @media (min-width:900px) { .grid-2 { grid-template-columns:1fr 1fr; } }
  .grid-2.inner { grid-template-columns:1fr; margin-top:0; }
  @media (min-width:1300px) { .grid-2.inner { grid-template-columns:1fr 1fr; } }
  .zone-list { display:flex; flex-direction:column; gap:6px; }
  .zone-item { display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:12px; font-size:14px; }
  .zone-item.on { background:var(--surface-2); font-weight:650; }
  .zone-item i { width:10px; height:10px; border-radius:50%; flex:none; }
  .zone-item .rng { margin-left:auto; color:var(--sub); font-size:13px; }
  .bars { display:flex; align-items:flex-end; gap:8px; height:170px; padding-top:18px; }
  .bar-col { flex:1; display:flex; flex-direction:column; align-items:center; height:100%; justify-content:flex-end; gap:6px; min-width:0; }
  .bar { width:100%; max-width:34px; display:flex; flex-direction:column-reverse; border-radius:8px; overflow:hidden; background:var(--surface-2); min-height:3px; }
  .bar > i { display:block; width:100%; }
  .bar-val { font-size:11px; font-weight:700; color:var(--sub); }
  .bar-lbl { font-size:11px; color:var(--faint); font-weight:600; }
  .bar-col.cur .bar-lbl { color:var(--accent); }
  .season-wrap { position:relative; margin:18px 0 6px; }
  .season-track { display:flex; height:12px; border-radius:99px; overflow:hidden; gap:2px; }
  .season-track i { display:block; height:100%; }
  .season-marker { position:absolute; top:-5px; width:4px; height:22px; background:var(--ink); border-radius:2px; transform:translateX(-50%); box-shadow:0 0 0 2px var(--surface); }
  .season-labels { display:flex; gap:2px; font-size:11px; color:var(--sub); font-weight:600; margin-top:6px; }

const toRad = (v) => v * Math.PI / 180;
function haversine([lat1,lon1],[lat2,lon2]) {
  const R=6371, dLat=toRad(lat2-lat1), dLon=toRad(lon2-lon1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
function loopDistance(pts){ let d=0; for(let i=1;i<pts.length;i++) d+=haversine(pts[i-1],pts[i]); return d; }
function interpolateLoop(pts, perSeg=5){
  const out=[];
  for(let i=0;i<pts.length-1;i++){
    const [lat1,lon1]=pts[i], [lat2,lon2]=pts[i+1];
    for(let s=0;s<perSeg;s++){ const f=s/perSeg; out.push({lat:lat1+(lat2-lat1)*f, lon:lon1+(lon2-lon1)*f}); }
  }
  out.push({lat:pts[pts.length-1][0], lon:pts[pts.length-1][1]});
  return out;
}
function genRealRoute(distanceKm, discipline){
  const pool = discipline === "lauf" ? RUN_LOOPS : BIKE_LOOPS;
  const template = pool.reduce((best,t)=> Math.abs(t.km-distanceKm)<Math.abs(best.km-distanceKm)?t:best, pool[0]);
  const laps = Math.max(1, Math.round(distanceKm/template.km));
  const points = interpolateLoop(template.pts);
  let allPoints=[]; for(let l=0;l<laps;l++) allPoints=allPoints.concat(points);
  const baseEle=520;
  const withEle = allPoints.map((p,i)=>({...p, ele: Math.round(baseEle + template.gain*0.5*(1+Math.sin((i/allPoints.length)*Math.PI*2*laps)))}));
  const actualKm = +(loopDistance(template.pts)*laps).toFixed(1);
  return { points: withEle, km: actualKm, elevGain: template.gain*laps, templateName: template.name, laps };
}

}

}
function parseGpx(text){
  try{
    const doc=new DOMParser().parseFromString(text,"application/xml");
    const pts=Array.from(doc.getElementsByTagName("trkpt"));
    if(!pts.length) return null;
    let dist=0, gain=0, prevLat, prevLon, prevEle;
    pts.forEach((p,i)=>{
      const lat=parseFloat(p.getAttribute("lat")), lon=parseFloat(p.getAttribute("lon"));
      const eleNode=p.getElementsByTagName("ele")[0]; const ele=eleNode?parseFloat(eleNode.textContent):null;
      if(i>0){ dist+=haversine([prevLat,prevLon],[lat,lon]); if(ele!=null && prevEle!=null && ele>prevEle) gain+=ele-prevEle; }

/* ================= ERG & strukturierte Workouts ================= */
function buildErg({warmupMin,warmupW,reps,workMin,workW,restMin,restW,cooldownMin,cooldownW}){
  let t=0; const rows=[];
  const push=(min,w)=>{ if(!(min>0)) return; rows.push([t.toFixed(2), Math.round(w)]); t+=min; rows.push([t.toFixed(2), Math.round(w)]); };
  push(warmupMin,warmupW); for(let i=0;i<reps;i++){ push(workMin,workW); push(restMin,restW); } push(cooldownMin,cooldownW);
  const body = rows.map(r=>`${r[0]}\t${r[1]}`).join("\n");
  return `[COURSE HEADER]\nVERSION = 2\nUNITS = ENGLISH\nDESCRIPTION = Generiert im Trainings-Dashboard\nFILE NAME = workout.erg\nMINUTES WATTS\n[END COURSE HEADER]\n[COURSE DATA]\n${body}\n[END COURSE DATA]\n`;
}
const ftpOrDefault = () => Number(state.settings.ftp) || 200;
// Intervall-Form (Belastung/Pause in min) je Zone für automatisch erzeugte ERG-Strukturen
const ERG_SHAPES = { z3:[10,5], sst:[10,5], thr:[8,4], vo2:[3,3], ana:[1,3] };
const ZONE_PCT = { z1:.5, z2:.65, z3:.8, sst:.9, thr:.98, vo2:1.12, ana:1.3 };
function defaultErg(zone, duration){
  const ftp = ftpOrDefault();
  const wu=10, cd=10, main=Math.max(5, Math.round(duration)-wu-cd);
  const base = { warmupMin:wu, warmupW:Math.round(ftp*.5), cooldownMin:cd, cooldownW:Math.round(ftp*.45), restW:Math.round(ftp*.5) };
  const shape = ERG_SHAPES[zone];
  if(!shape) return { ...base, reps:1, workMin:main, workW:Math.round(ftp*(ZONE_PCT[zone]||.65)), restMin:0 };
  const [work, rest] = shape;
  return { ...base, reps:Math.max(1, Math.floor(main/(work+rest))), workMin:work, workW:Math.round(ftp*ZONE_PCT[zone]), restMin:rest };
}
function pctToErg(p){
  const ftp = ftpOrDefault();
  return { warmupMin:p.warmupMin, warmupW:Math.round(ftp*p.warmupPct), reps:p.reps, workMin:p.workMin, workW:Math.round(ftp*p.workPct),
    restMin:p.restMin, restW:Math.round(ftp*p.restPct), cooldownMin:p.cooldownMin, cooldownW:Math.round(ftp*p.cooldownPct) };
}
function ergSegments(erg){
  const s=[]; const add=(min,w)=>{ if(Number(min)>0) s.push({ min:Number(min), w:Number(w) }); };
  add(erg.warmupMin, erg.warmupW);
  for(let i=0;i<Number(erg.reps||0);i++){ add(erg.workMin, erg.workW); add(erg.restMin, erg.restW); }
  add(erg.cooldownMin, erg.cooldownW);
  return s;
}
function ftpRef(segs){ const ftp=Number(state.settings.ftp)||0; return ftp || Math.max(1, ...segs.map(s=>s.w)); }
function powerColor(pct){
  if(pct<0.56) return "var(--z1)"; if(pct<0.76) return "var(--z2)"; if(pct<0.88) return "var(--z3)";
  if(pct<0.94) return "var(--sst)"; if(pct<1.06) return "var(--thr)"; if(pct<1.21) return "var(--vo2)"; return "var(--ana)";
}
function ergProfileSVG(erg, h=56){
  const segs = ergSegments(erg); const total = segs.reduce((s,x)=>s+x.min,0);
  if(!total) return "";
  const ref = ftpRef(segs); const top = Math.max(ref*1.25, ...segs.map(s=>s.w));
  let x=0, out="";
  segs.forEach(s=>{
    const w = s.min/total*1000, hh = Math.max(2, s.w/top*h);
    out += `<rect x="${x+1}" y="${h-hh}" width="${Math.max(1,w-2)}" height="${hh}" style="fill:${powerColor(s.w/ref)}"/>`;
    x += w;
  });
  return `<svg viewBox="0 0 1000 ${h}" height="${h}" preserveAspectRatio="none">${out}</svg>`;
}
function ergSummary(erg){
  const segs = ergSegments(erg); const total = segs.reduce((s,x)=>s+x.min,0);
  const ftp = Number(state.settings.ftp)||0;
  const avg = total ? Math.round(segs.reduce((s,x)=>s+x.w*x.min,0)/total) : 0;
  const tss = ftp ? Math.round(segs.reduce((s,x)=>s + x.min/60 * (x.w/ftp)**2 * 100, 0)) : null;
  return { total, avg, tss };
}
// Workout-Text im intervals.icu-Format — daraus wird dort ein strukturiertes Workout,
// das auf Garmin/Wahoo/Zwift synchronisiert wird.
function workoutDoc(w){
  const ftp = Number(state.settings.ftp)||0;
  const p = (watts) => ftp ? `${Math.round(watts/ftp*100)}%` : `${Math.round(watts)}w`;
  const g = discGroup(w.discipline);
  if(w.erg){
    const e=w.erg, out=[];
    if(e.warmupMin>0) out.push("Warmup", `- ${e.warmupMin}m ${p(e.warmupW)}`, "");
    if(e.reps>0 && e.workMin>0){
      out.push(e.reps>1 ? `Main Set ${e.reps}x` : "Main Set", `- ${e.workMin}m ${p(e.workW)}`);
      if(e.restMin>0) out.push(`- ${e.restMin}m ${p(e.restW)}`);
      out.push("");
    }
    if(e.cooldownMin>0) out.push("Cooldown", `- ${e.cooldownMin}m ${p(e.cooldownW)}`);
    return out.join("\n").trim();
  }
  if(g==="bike" || g==="run"){
    const suffix = g==="run" ? " HR" : ""; // Laufen nach Herzfrequenz, Rad nach Leistungszonen
    const Z = g==="bike" && w.zone==="sst" ? "88-93%" : ({ z1:"Z1", z2:"Z2", z3:"Z3", sst:"Z3", thr:"Z4", vo2:"Z5", ana:"Z5" }[w.zone] || "Z2") + suffix;
    const d = Math.round(w.duration||0);
    if(d < 40) return `- ${d}m ${Z}`;
    return ["Warmup", `- 10m Z1${suffix}`, "", "Main Set", `- ${d-20}m ${Z}`, "", "Cooldown", `- 10m Z1${suffix}`].join("\n");
  }
  return "";
}

function seasonPayload(){
  const s = seasonInfo();
  return s ? { name:s.name, type:s.type, date:s.date, weeks:s.weeks, phase:s.phase.label } : null;
}
function trainingPhase(ctl){
  const s = seasonInfo();
  if(s && s.days >= 0) return { id:s.phase.id, label:s.phase.label, note:s.phase.note };
  if(ctl<20) return { id:"base", label:"Grundlagenaufbau", note:"Sehr niedrige Fitness — Fokus liegt auf lockerer, häufiger Belastung statt Intensität. Intensitätsverteilung ca. 90/10 (leicht/hart), angelehnt an das polarisierte Modell nach Seiler." };
  if(ctl<40) return { id:"build", label:"Grundlage / Übergang", note:"Basis ist gelegt — erste gezielte Tempo- und Schwellenreize werden ergänzt. Verteilung ca. 80/20." };
  return { id:"build", label:"Aufbau / Intensivierung", note:"Solide Basis vorhanden — VO2max- und Schwellenintervalle bekommen mehr Gewicht." };
}
// Fitness-Prognose (Banister-Modell): geplante Lasten, danach ein phasengerechtes Modell bis zum Wettkampf.
function projectFitness(untilKey){
  const c = CURR(); let ctl=c.ctl, atl=c.atl; const out=[]; const s=seasonInfo();
  const tk = todayKey();
  const lastPlanned = Object.keys(state.plan).filter(k=>k>=tk && (state.plan[k]||[]).length).sort().pop() || tk;
  const d = fromKey(tk), end = fromKey(untilKey);
  for(let i=0; d<=end && i<600; i++){
    const k = iso(d);
    let load;
    if(k <= lastPlanned){
      load = (state.plan[k]||[]).reduce((sum,w)=> sum + ((MATCH.wm.get(w.id)||{}).load ?? w.load ?? 0), 0);
    } else {
      const p = phaseForWeeks(s ? (s.raceDate - d)/(7*864e5) : 20);
      const ramp = p.ramp==null ? null : p.ramp * Math.max(0, Math.min(1, (85-ctl)/25)); // flacht bei hoher Fitness ab
      load = ramp==null ? ctl*0.65 : ctl + 6*ramp; // Tapering: ~35 % weniger Last
    }
    const tsb = ctl - atl; // Form am Morgen = Stand vor der Tagesbelastung
    ctl += (load-ctl)/42; atl += (load-atl)/7;
    out.push({ day:k, date:k.slice(5), ctl:+ctl.toFixed(1), atl:+atl.toFixed(1), tsb:+tsb.toFixed(1), projected:true });
    d.setDate(d.getDate()+1);
  }
  return out;
}

// Form-Zonen nach dem Performance-Management-Modell (angelehnt an intervals.icu)
const FORM_ZONES = [
  { min:25, label:"Übergang", hint:"Sehr frisch — hält das länger an, geht Fitness verloren.", color:"var(--c-rolle)", range:"> +25" },
  { min:5, label:"Frisch", hint:"Ausgeruht — guter Zeitpunkt für einen harten Reiz, Test oder Wettkampf.", color:"var(--info)", range:"+5 bis +25" },
  { min:-10, label:"Neutral", hint:"Graue Zone — Fitness wird gehalten, aber kaum aufgebaut.", color:"var(--faint)", range:"−10 bis +5" },
  { min:-30, label:"Optimal", hint:"Produktiver Trainingsreiz — hier wird Fitness aufgebaut.", color:"var(--good)", range:"−30 bis −10" },
  { min:-Infinity, label:"Hohes Risiko", hint:"Starke Ermüdung — Regeneration einplanen, Verletzungsrisiko steigt.", color:"var(--warn)", range:"< −30" },
];
const formStatus = (tsb) => FORM_ZONES.find(z => tsb > z.min) || FORM_ZONES[FORM_ZONES.length-1];
function rampStatus(delta){
  if(delta < 0) return { label:"Fitness sinkt", color:"var(--sub)" };
  if(delta < 3) return { label:"Erhaltend", color:"var(--info)" };
  if(delta < 6) return { label:"Moderater Aufbau", color:"var(--good)" };
  if(delta < 8) return { label:"Sportlicher Aufbau", color:"var(--sst)" };
  return { label:"Zu steil — Verletzungsrisiko", color:"var(--warn)" };
}

/* ================= Regelbasierter Auto-Plan ================= */
function generateAutoPlan(days, ctl, adj={ factor:1, reasons:[] }){
  const active = days.filter(d=>d.hours>0).sort((a,b)=>b.hours-a.hours);
  if(!active.length) return { workouts:[], warning:"Keine Trainingstage ausgewählt." };
  const phase = trainingPhase(ctl);
  const workouts=[]; const used=new Set();
  const assign=(day, discipline, minutes, zone, title, goal)=>{
    used.add(day.key);
    const weather=getWeather(day.key); const outdoorOk=isOutdoorFriendly(weather);
    let finalDiscipline=discipline; if(discipline==="rad" && weather && !outdoorOk) finalDiscipline="rolle";
    minutes = Math.max(20, Math.round(minutes*adj.factor/5)*5);
    const w={ id:Date.now()+Math.random(), done:false, dateKey:day.key, discipline:finalDiscipline, title, duration:minutes,
      zone, load:estLoad(minutes,zone), goal,
      weatherNote: weather ? `${Math.round(weather.high)}°C, Regenwahrscheinlichkeit ${weather.precip}%${finalDiscipline!==discipline?" → wegen Wetter auf Rolle verlegt":""}` : "Keine Vorhersage verfügbar — Standardannahme." };
    Object.assign(w, routePatch(finalDiscipline, minutes));
    if(finalDiscipline==="rolle") w.erg = defaultErg(zone, minutes);
    workouts.push(w);
  };
  const longDay = active[0];
  assign(longDay, "rad", Math.min(longDay.hours*60,180), "z2", "Lange Grundlagenfahrt",
    "Aerobe Grundlagenausdauer: verbessert Kapillarisierung, Fettstoffwechsel und mitochondriale Dichte — das Fundament der Wettkampfausdauer für den Triathlon.");
  // Harte Einheit nicht direkt nach schlechter Tagesform legen; bei schwacher Erholung (Schlaf/Energie) ganz locker
  const rideCands = active.filter(d=>!used.has(d.key) && d.hours>=0.75);
  const secondRideDay = rideCands.find(d=>!adj.easyUntil || d.key>adj.easyUntil) || rideCands[0];
  const hardOk = secondRideDay && !adj.limitIntensity && (!adj.easyUntil || secondRideDay.key>adj.easyUntil);
  if(secondRideDay){
    if(!hardOk && (phase.id==="build" || phase.id==="peak")) assign(secondRideDay,"rad",Math.min(secondRideDay.hours*60,75),"z2","Lockere Grundlage statt Intervallen",
      "Deine Erholung (Schlaf, Energie, Tagesform) reicht gerade nicht für einen harten Reiz — Intervalle bringen unter Erholungsdefizit wenig Anpassung, aber viel Ermüdung. Locker halten, die Qualität kommt zurück, sobald du ausgeruht bist.");
    else if(phase.id==="build") assign(secondRideDay,"rad",Math.min(secondRideDay.hours*60,75),"sst","Sweet-Spot-Intervalle",
      "Sweet-Spot-Arbeit knapp unter der Schwelle hebt die FTP mit vertretbarer Ermüdung — Kernreiz der Aufbauphase.");
    else if(phase.id==="peak") assign(secondRideDay,"rad",Math.min(secondRideDay.hours*60,75),"thr","Schwellenintervalle",
      "Wettkampfnahe Intensität an der Schwelle — trainiert das Tempo, das du im Triathlon halten willst.");
    else assign(secondRideDay,"rad",Math.min(secondRideDay.hours*60,90),"z2","Rad mit Tempo-Reizen",
      "Hält die aerobe Basis und setzt sanfte Tempo-Reize — bereitet die Muskulatur behutsam auf spätere Schwellenarbeit vor, ohne die Regeneration zu gefährden.");
  }
  const runDays = active.filter(d=>!used.has(d.key) && d.hours>=0.3).slice(0,2);
  runDays.forEach(d=>assign(d,"lauf",Math.min(d.hours*60,30),"z1","Lauf (Run/Walk 3:1)",
    "Aerobe Laufökonomie und Gewöhnung von Sehnen/Bändern an kontinuierliche Belastung — wichtig, da deine bisherige Basis aus intervallastigem Handball stammt, nicht aus Dauerbelastung. Tempo bewusst langsam halten."));
  const strengthDay = active.find(d=>!used.has(d.key) && d.hours>=0.3);
  if(strengthDay) assign(strengthDay,"kraft",Math.min(strengthDay.hours*60,35),"z1","Rumpf & Mobility",
    "Rumpfstabilität und muskuläre Grundkraft — unterstützt die Lauf-/Radökonomie und beugt Überlastungen beim Laufaufbau vor.");
  const totalLoad = workouts.reduce((s,w)=>s+w.load,0);
  const safeLoad = ctl*7*1.15;
  const warning = totalLoad > safeLoad*1.25 ? `Geplante Wochenlast (${totalLoad}) liegt deutlich über einem verträglichen Aufbau-Tempo (~${Math.round(safeLoad)}). Risiko für Übertraining/Verletzung — Umfang oder Intensität reduzieren.` : null;
  const note = adj.factor!==1 ? `Umfang ${adj.factor<1?"reduziert":"erhöht"} (${signed((adj.factor-1)*100,0)} %): ${adj.reasons.join(", ")}.` : null;
  const recNote = adj.limitIntensity ? "Wegen schwacher Erholung (Schlaf/Energie) diese Woche ohne harte Intervalle." : adj.easyUntil ? "Wegen niedriger Tagesform heute/morgen keine harte Einheit." : null;
  return { workouts, warning, note:[note, recNote].filter(Boolean).join(" ") || null, totalLoad, safeLoad:Math.round(safeLoad) };
}

async function fetchJSON(url, opts){
  const r = await fetch(url, opts);
  let j; try { j = await r.json(); } catch { throw new Error(`Keine gültige Antwort (${r.status})`); }
  if(!r.ok || (j && j.error)) throw new Error((j && j.error) || `HTTP ${r.status}`);
  return j;
}
const STORE_URL = { plan:`${API}/plan`, settings:`${API}/settings`, library:`${API}/store?key=library`, journal:`${API}/store?key=journal` };
async function save(kind){
  LS.set(`cache:${kind}`, state[kind]);
  try {
    const r = await fetch(STORE_URL[kind], { method:"POST", headers:JSON_H, body:JSON.stringify(state[kind]) });
    if(!r.ok) throw new Error(`HTTP ${r.status}`);
    state.pending[kind] = false;
  } catch(e) {
    console.warn(`${kind} nur lokal gespeichert:`, e.message);
    state.pending[kind] = true;
  }
  LS.set("pending", state.pending);
}
const persistPlan = () => save("plan");
const persistSettings = () => save("settings");
const persistLibrary = () => save("library");
const persistJournal = () => save("journal");
function flushPending(){ Object.keys(state.pending).forEach(k=>{ if(state.pending[k]) save(k).then(render); }); }

async function loadState(){
  const get = (kind, def) => fetchJSON(STORE_URL[kind]).catch(()=>LS.get(`cache:${kind}`, def));
  const [plan, settings, library, journal] = await Promise.all([get("plan",{}), get("settings",null), get("library",[]), get("journal",null)]);
  // Noch nicht synchronisierte lokale Änderungen haben Vorrang vor dem Serverstand
  const pick = (kind, remote) => state.pending[kind] ? LS.get(`cache:${kind}`, remote) : remote;
  state.plan = pick("plan", plan) || {};
  state.settings = { ...DEFAULT_SETTINGS, ...(pick("settings", settings) || {}) };
  const lib = pick("library", library);
  state.library = Array.isArray(lib) ? lib : [];
  state.journal = { checkins:{}, reviews:{}, ...(pick("journal", journal) || {}) };
  ["plan","settings","library","journal"].forEach(k=>LS.set(`cache:${k}`, state[k]));
  state.ready = true;
  render();
  loadWeather();
  syncFromIntervals(false);
  if(state.online) flushPending();
}
async function syncFromIntervals(manual=true){
  if(state.syncStatus==="loading") return;
  state.syncStatus = "loading"; render();
  try {
    const [fitness, activities] = await Promise.all([
      fetchJSON(`${API}/intervals-fitness?oldest=${addDays(todayKey(), -120)}`),
      fetchJSON(`${API}/intervals-activities?oldest=${addDays(todayKey(), -365)}${Number(state.settings.ftp) ? `&ftp=${Number(state.settings.ftp)}` : ""}`),
    ]);
    if (fitness.length){ FITNESS_LIVE = fitness; LS.set("cache:fitness", fitness); }
    if (activities.length){ ACTIVITIES_LIVE = activities; LS.set("cache:activities", activities); }
    state.syncStatus = "ok";
    if(manual) toast("Mit intervals.icu synchronisiert");
    fetchJSON(`${API}/intervals-power-curve?type=Ride&curves=84d`)
      .then(c=>{ if(Array.isArray(c) && c.length){ POWER_LIVE=c[0]; LS.set("cache:power", c[0]); render(); } })
      .catch(e=>console.warn("Leistungskurve nicht verfügbar:", e.message));

    state.syncStatus = "error";
    if(manual) toast(state.online ? "Sync fehlgeschlagen — zeige gespeicherte Daten" : "Offline — zeige gespeicherte Daten", "err");

}

function removeWorkout(dateKey, id){

function moveWorkout(id, from, to){
  if(!to || from===to) return;
  const w = findWorkout(from, id); if(!w) return;
  state.plan[from] = state.plan[from].filter(x=>x.id!==id);
  if(!state.plan[from].length) delete state.plan[from];
  const moved = { ...w, dateKey:to };
  const wx = getWeather(to);
  if(wx) moved.weatherNote = `${Math.round(wx.high)}°C, Regenwahrscheinlichkeit ${wx.precip}%`;
  state.plan[to] = [...(state.plan[to]||[]), moved];
  persistPlan();
  if(w.eventId || state.settings.autoPush) pushWorkout(to, id, true);
  toast(`Verschoben auf ${fmtShort(to)}`);

/* ================= Geplant vs. absolviert ================= */
// Sportart einer Aktivität: zuerst über den intervals.icu-Typ, nur ohne Typ über den Namen
const ACT_TYPES = { Ride:"rad", GravelRide:"rad", MountainBikeRide:"rad", EBikeRide:"rad", EMountainBikeRide:"rad", Velomobile:"rad",
  VirtualRide:"rolle", TrackRide:"rad", Run:"lauf", TrailRun:"lauf", VirtualRun:"lauf", Walk:"sonstiges", Hike:"sonstiges",
  Swim:"schwimmen", OpenWaterSwim:"schwimmen", WeightTraining:"kraft", Workout:"kraft", Yoga:"kraft", Pilates:"kraft", Crossfit:"kraft" };
function actDisc(a){
  if(a.type && ACT_TYPES[a.type]) return ACT_TYPES[a.type];
  const n = `${a.type||""} ${a.name||""}`.toLowerCase();
  if(/virtual|indoor|zwift|rolle|trainer|rouvy|wahoo systm/.test(n)) return "rolle";
  if(/\b(run|running|jog)\b|lauf|läuf|jogg/.test(n)) return "lauf";
  if(/swim|schwimm/.test(n)) return "schwimmen";
  if(/weight|kraft|strength|mobility|rumpf/.test(n)) return "kraft";
  return "rad";
}
// Ordnet jeder geplanten Einheit höchstens eine Aktivität zu:
// 1. exakt über die Paarung in intervals.icu (Event-ID des gesendeten Workouts),
// 2. sonst eine Aktivität desselben Tages und derselben Sportart.
function buildMatches(){
  const acts = currentActivities(), used = new Set(), wm = new Map(), aw = new Map(), unplanned = {};
  const link = (w, k, a) => { wm.set(w.id, a); aw.set(a, { w, k }); used.add(a); };
  const byEvent = new Map(acts.filter(a=>a.pairedEventId!=null).map(a=>[String(a.pairedEventId), a]));
  Object.entries(state.plan).forEach(([k,ws])=>ws.forEach(w=>{
    const a = w.eventId!=null && byEvent.get(String(w.eventId));
    if(a && !used.has(a)) link(w, k, a);
  }));
  const byDate = {};
  acts.forEach(a=>{ if(!used.has(a)) (byDate[a.date] = byDate[a.date] || []).push(a); });
  new Set([...Object.keys(byDate), ...Object.keys(state.plan)]).forEach(k=>{
    const free = [...(byDate[k]||[])];
    (state.plan[k]||[]).forEach(w=>{
      if(wm.has(w.id)) return;
      const g = discGroup(w.discipline); let bi=-1, bd=Infinity;
      free.forEach((a,i)=>{ if(a.pairedEventId!=null && a.pairedEventId!==w.eventId) return; // gehört zu einem anderen Event
        if(discGroup(actDisc(a))!==g) return; const diff=Math.abs(a.min-(w.duration||0)); if(diff<bd){ bd=diff; bi=i; } });
      if(bi>=0){ link(w, k, free[bi]); free.splice(bi,1); }
    });
    if(free.length) unplanned[k] = free;
  });
  return { wm, aw, unplanned };
}
// Dauer einer Aktivität — bei Strava-Stubs (keine Daten über die API) die geplante Dauer als Näherung
const actMin = (a) => a.min || (a.stub && MATCH.aw && MATCH.aw.get(a) ? Number(MATCH.aw.get(a).w.duration)||0 : 0);
const actName = (a) => a.stub && MATCH.aw && MATCH.aw.get(a) ? MATCH.aw.get(a).w.title : a.name;
const isDone = (w) => !!(w.done || MATCH.wm.has(w.id));
function workoutStatus(w, key){
  const a = MATCH.wm.get(w.id);
  if(a && !a.min) return { kind:"matched", a, pct:null, color:"var(--good)", text:"Erledigt · in intervals.icu verknüpft" };
  if(a){
    const pct = Math.round(a.min / Math.max(1, w.duration) * 100);
    const color = pct>=80 && pct<=120 ? "var(--good)" : pct>=50 && pct<=150 ? "var(--sst)" : "var(--thr)";
    return { kind:"matched", a, pct, color, text:`${fmtDur(a.min)} absolviert · ${pct} %` };
  }
  if(w.done) return { kind:"done", color:"var(--good)", text:"Erledigt" };
  if(key < todayKey()) return { kind:"missed", color:"var(--warn)", text:"Verpasst" };
  return { kind:"open" };
}
function weekStats(days){
  const tk = todayKey();
  const s = { min:0, load:0, n:0, done:0, doneMin:0, band:{low:0,mid:0,high:0}, disc:{}, dueMin:0, credit:0, rpe:[], missed:0 };
  days.forEach(d=>{ const k=iso(d); (state.plan[k]||[]).forEach(w=>{
    const m = Number(w.duration)||0, a = MATCH.wm.get(w.id), done = w.done || !!a;
    s.min+=m; s.load+=Number(w.load)||0; s.n++;
    const am = a ? (a.min || m) : null; // Stub ohne Dauer → als planmäßig absolviert werten
    if(done){ s.done++; s.doneMin += a ? am : m; }
    if(k<tk || (k===tk && done)){ s.dueMin+=m; s.credit += Math.min(a ? am : (w.done ? m : 0), m*1.2); if(!done) s.missed++; }
    s.band[zoneById(w.zone).band]+=m;
    s.disc[w.discipline]=(s.disc[w.discipline]||0)+m;
    if(w.rpe) s.rpe.push(w.rpe);
  }); });
  s.compliance = s.dueMin ? Math.round(s.credit/s.dueMin*100) : null;
  s.avgRpe = s.rpe.length ? s.rpe.reduce((a,b)=>a+b,0)/s.rpe.length : null;
  return s;
}
function upcoming(limit){
  const tk = todayKey(); const out=[];
  Object.keys(state.plan).filter(k=>k>tk).sort().forEach(k=>(state.plan[k]||[]).forEach(w=>{ if(!isDone(w)) out.push({ k, w }); }));
  return out.slice(0, limit);
}
function weeklyVolume(weeks=8){
  const cur = startOfWeek(new Date());
  return Array.from({length:weeks}, (_,i)=>{
    const ws = new Date(cur); ws.setDate(ws.getDate() - 7*(weeks-1-i));
    const we = new Date(ws); we.setDate(we.getDate()+7);
    const byDisc = {}; let min=0;
    currentActivities().forEach(a=>{
      const d = fromKey(a.date);
      if(d>=ws && d<we){ const k=actDisc(a), am=actMin(a); byDisc[k]=(byDisc[k]||0)+am; min+=am; }
    });
    return { ws, min, byDisc, current:i===weeks-1 };
  });
}

/* ================= Schlaf & Energie ================= */
const sleepNeed = () => Number(state.settings.sleepNeed) || 8; // Schlafbedarf in Stunden (Einstellungen)
const sleepH = (d) => d && d.sleepSecs ? d.sleepSecs/3600 : null;
const mean = (v) => { v=v.filter(x=>x!=null && !isNaN(x)); return v.length ? v.reduce((a,b)=>a+b,0)/v.length : null; };
function wellnessRows(){ return (FITNESS_LIVE||[]).filter(d=>d.day); }
// Energie kommt je nach Quelle als 0–100 (z. B. Body Battery), 1–10 oder 1–5 → auf 0–100 normieren.
function energyScale(){
  const max = Math.max(0, ...wellnessRows().map(d=>d.energy).filter(v=>v!=null));
  return max>10 ? 100 : max>5 ? 10 : 5;
}
function energyPct(v, scale=energyScale()){
  if(v==null) return null;
  return Math.round(Math.min(100, Math.max(0, scale===5 ? (v-1)/4*100 : v/scale*100)));
}
const fmtEnergy = (v, scale=energyScale()) => v==null ? "–" : scale===100 ? `${Math.round(v)}` : `${fmtNum(v, v%1?1:0)}/${scale}`;
// intervals.icu-Schlafqualität: 1 = super … 4 = schlecht
const sleepQualityPct = (q) => q==null ? null : Math.round((4-q)/3*100);
const sleepDurScore = (h) => h>=sleepNeed() ? 95 : h>=sleepNeed()-1 ? 80 : h>=sleepNeed()-2 ? 60 : 35;
// Eine Nacht als 0–100: Dauer, ggf. Schlafscore und -qualität des Geräts gemittelt
function nightScore(d){
  const h = sleepH(d); const parts = [];
  if(h) parts.push(sleepDurScore(h));
  if(d && d.sleepScore!=null) parts.push(d.sleepScore);
  if(d && d.sleepQuality!=null) parts.push(sleepQualityPct(d.sleepQuality));
  return parts.length ? Math.round(mean(parts)) : null;
}
const hasRecoveryData = (d) => d && (d.sleepSecs || d.sleepScore!=null || d.sleepQuality!=null || d.energy!=null);

// Erholungsbild der letzten `days` Tage im Vergleich zur 28-Tage-Basis davor
function recoveryStats(days=7){
  const rows = wellnessRows(), tk = todayKey(), from = addDays(tk, -days+1), baseFrom = addDays(from, -28);
  const recent = rows.filter(d=>d.day>=from && d.day<=tk), base = rows.filter(d=>d.day>=baseFrom && d.day<from);
  if(!recent.some(hasRecoveryData)) return null;
  const scale = energyScale(), need = sleepNeed();
  const nights = recent.filter(d=>sleepH(d));
  const energyNow = [...recent].reverse().find(d=>d.energy!=null);
  const lastNight = [...recent].reverse().find(d=>sleepH(d) || d.sleepScore!=null);
  const s = {
    days, need, scale,
    nights: nights.length,
    sleepAvg: mean(nights.map(sleepH)),
    sleepBase: mean(base.map(sleepH)),
    sleepDebt: Math.max(0, nights.reduce((sum,d)=>sum + need - sleepH(d), 0)),
    sleepScoreAvg: mean(recent.map(d=>d.sleepScore)),
    nightAvg: mean(recent.map(nightScore)),
    energyAvg: mean(recent.map(d=>energyPct(d.energy, scale))),
    energyBase: mean(base.map(d=>energyPct(d.energy, scale))),
    energyNow: energyNow ? { day:energyNow.day, raw:energyNow.energy, pct:energyPct(energyNow.energy, scale) } : null,
    lastNight: lastNight && lastNight.day>=addDays(tk,-1) ? { day:lastNight.day, hours:sleepH(lastNight), score:lastNight.sleepScore, quality:lastNight.sleepQuality, hr:lastNight.avgSleepingHR } : null,
    series: recent.map(d=>({ day:d.day, sleepH:sleepH(d) ? +sleepH(d).toFixed(1) : null, sleepScore:d.sleepScore, energy:energyPct(d.energy, scale) })),
  };
  s.energyTrend = s.energyAvg!=null && s.energyBase!=null ? s.energyAvg - s.energyBase : null;
  // Gesamtbild 0–100 aus Schlaf der Woche und Energieniveau
  const parts = [];
  if(s.nightAvg!=null) parts.push([s.nightAvg, 1]);
  if(s.sleepDebt>=3) parts.push([s.sleepDebt>=7 ? 30 : 55, .75]);
  if(s.energyAvg!=null) parts.push([Math.min(95, s.energyAvg + (s.energyTrend!=null ? Math.max(-15, Math.min(10, s.energyTrend/2)) : 0)), 1]);
  s.score = parts.length ? Math.round(parts.reduce((a,[v,w])=>a+v*w,0)/parts.reduce((a,[,w])=>a+w,0)) : null;
  s.level = s.score==null ? null : s.score>=70 ? READY_LEVELS.good : s.score>=50 ? READY_LEVELS.mid : READY_LEVELS.low;
  return s;
}
// Wie reagiert die Energie auf harte Trainingstage? (nächster Morgen nach hoher vs. normaler Last)
function energyAfterLoad(){
  const rows = wellnessRows().filter(d=>d.energy!=null); if(rows.length<14) return null;
  const load = {}; currentActivities().forEach(a=>{ if(a.load) load[a.date]=(load[a.date]||0)+a.load; });
  const loads = Object.values(load).sort((a,b)=>a-b); if(loads.length<8) return null;
  const hardMin = loads[Math.floor(loads.length*.75)], scale = energyScale();
  const hard=[], other=[];
  rows.forEach(d=>{ const l = load[addDays(d.day,-1)]||0; (l>=hardMin ? hard : other).push(energyPct(d.energy, scale)); });
  if(hard.length<4 || other.length<4) return null;
  return { hardMin:Math.round(hardMin), delta:Math.round(mean(hard)-mean(other)), n:hard.length };
}
function recoveryPayload(){
  const s = recoveryStats(7); if(!s) return null;
  const r1 = (v) => v==null ? null : +v.toFixed(1);
  return {
    sleepNeedH: s.need, nights: s.nights, sleepAvgH: r1(s.sleepAvg), sleepBaseH: r1(s.sleepBase), sleepDebtH: r1(s.sleepDebt),
    sleepScoreAvg: s.sleepScoreAvg!=null ? Math.round(s.sleepScoreAvg) : null,
    energyAvgPct: s.energyAvg!=null ? Math.round(s.energyAvg) : null, energyBasePct: s.energyBase!=null ? Math.round(s.energyBase) : null,
    energyTodayPct: s.energyNow ? s.energyNow.pct : null,
    lastNight: s.lastNight ? { hours:r1(s.lastNight.hours), score:s.lastNight.score ?? null } : null,
    score: s.score, level: s.level ? s.level.label : null,
    energyAfterHardDay: energyAfterLoad(),
    series: s.series,
  };
}

/* ================= Tagesform & Feedback ================= */
function latestWellness(){
  const f = FITNESS_LIVE || [];
  const rows = f.filter(d=>d.hrv!=null || d.restingHR!=null || hasRecoveryData(d));
  if(!rows.length) return null;
  const last = rows[rows.length-1];
  if(!last.day || last.day < addDays(todayKey(), -1)) return null; // älter als gestern → nicht aussagekräftig
  const prev = f.filter(d=>d.day < last.day).slice(-7);
  const avg = (k) => { const v=prev.map(d=>d[k]).filter(x=>x!=null); return v.length ? v.reduce((a,b)=>a+b,0)/v.length : null; };
  // Schlaf der letzten Nacht kann auf dem heutigen oder gestrigen Eintrag liegen
  const sleepRow = [...rows].reverse().find(d=>d.day>=addDays(todayKey(),-1) && (d.sleepSecs || d.sleepScore!=null));
  const energyRow = [...rows].reverse().find(d=>d.day>=addDays(todayKey(),-1) && d.energy!=null);
  return { ...last, hrvBase:avg("hrv"), rhrBase:avg("restingHR"),
    sleepSecs: sleepRow ? sleepRow.sleepSecs : null, sleepScore: sleepRow ? sleepRow.sleepScore : null,
    sleepQuality: sleepRow ? sleepRow.sleepQuality : null, energy: energyRow ? energyRow.energy : null };
}
const READY_LEVELS = {
  good:{ id:"good", label:"Bereit", color:"var(--good)", text:"Gute Voraussetzungen — trainiere wie geplant." },
  mid:{ id:"mid", label:"Eingeschränkt", color:"var(--sst)", text:"Intensität heute eher zurücknehmen, locker ist okay." },
  low:{ id:"low", label:"Erholung nötig", color:"var(--warn)", text:"Dein Körper braucht Erholung — locker bewegen oder pausieren." },
};
function readiness(){
  const ci = state.journal.checkins && state.journal.checkins[todayKey()];
  const w = latestWellness(), tsb = CURR().tsb, f = [];
  f.push({ label:"Form", value:signed(tsb), score: tsb>=5?90 : tsb>=-10?75 : tsb>=-20?58 : tsb>=-30?42 : 25, weight:1 });
  if(w && w.hrv!=null && w.hrvBase){ const r=w.hrv/w.hrvBase;
    f.push({ label:"HRV", value:`${Math.round(w.hrv)} ms (${signed((r-1)*100,0)} %)`, score: r>=1?90 : r>=.95?75 : r>=.9?55 : 35, weight:1.5 }); }
  if(w && w.restingHR!=null && w.rhrBase){ const d=w.restingHR-w.rhrBase;
    f.push({ label:"Ruhepuls", value:`${Math.round(w.restingHR)} (${signed(d,0)})`, score: d<=0?90 : d<=3?70 : d<=6?50 : 30, weight:1 }); }
  const sleepHrs = w && w.sleepSecs ? w.sleepSecs/3600 : (ci && ci.sleepHours ? Number(ci.sleepHours) : null);
  const night = w && (w.sleepScore!=null || w.sleepQuality!=null) ? nightScore({ ...w, sleepSecs: sleepHrs ? sleepHrs*3600 : null }) : null;
  if(sleepHrs || night!=null) f.push({ label:"Schlaf", value:[sleepHrs ? `${fmtNum(sleepHrs)} h` : null, w && w.sleepScore!=null ? `Score ${Math.round(w.sleepScore)}` : null].filter(Boolean).join(" · "),
    score: night ?? sleepDurScore(sleepHrs), weight:1.25 });
  if(w && w.energy!=null){ const p=energyPct(w.energy);
    f.push({ label:"Energie", value:fmtEnergy(w.energy), score: Math.max(20, Math.min(95, p)), weight:1.25 }); }
  const rs = recoveryStats(7);
  if(rs && rs.nights>=3 && rs.sleepDebt>=3) f.push({ label:"Schlafdefizit 7 T", value:`${fmtNum(rs.sleepDebt)} h`, score: rs.sleepDebt>=7 ? 35 : 55, weight:.75 });
  if(ci){ const subj = (ci.sleep + ci.energy + (6-ci.soreness) + (6-ci.stress))/4;
    f.push({ label:"Gefühl", value:`${fmtNum(subj)}/5`, score:Math.round(20 + (subj-1)/4*75), weight:1.5 }); }
  const W = f.reduce((s,x)=>s+x.weight,0);
  const score = Math.round(f.reduce((s,x)=>s+x.score*x.weight,0)/W);
  const level = score>=70 ? READY_LEVELS.good : score>=45 ? READY_LEVELS.mid : READY_LEVELS.low;
  return { score, level, factors:f, hasCheckin:!!ci, hasWellness:!!w };
}
function feedbackSummary(days=14){
  const from = addDays(todayKey(), -days), tk = todayKey(); const items=[];
  Object.entries(state.plan).forEach(([k,ws])=>{ if(k<from || k>tk) return; ws.forEach(w=>{ if(w.rpe) items.push({ k, w }); }); });
  if(!items.length) return { count:0 };
  const avgDelta = +(items.reduce((s,{w})=>s + (w.rpe - (EXPECTED_RPE[w.zone]||4)), 0)/items.length).toFixed(1);
  const notes = items.filter(({w})=>w.feedback).sort((a,b)=>a.k<b.k?1:-1).slice(0,5).map(({w})=>w.feedback);
  return { count:items.length, avgDelta, notes };
}
// Umfangs-/Intensitäts-Anpassung für den Auto-Plan aus RPE-Feedback, Tagesform, Schlaf und Energie
function planAdjustments(){
  const fb = feedbackSummary(), r = readiness(), rec = recoveryStats(7); let factor = 1; const reasons = [];
  let limitIntensity = false, easyUntil = null;
  const recLow = rec && rec.level && rec.level.id==="low", recMid = rec && rec.level && rec.level.id==="mid";
  if(fb.count>=2 && fb.avgDelta>=1.5){ factor*=.85; reasons.push(`letzte Einheiten fühlten sich härter an als geplant (Ø ${signed(fb.avgDelta)} RPE)`); }
  else if(fb.count>=3 && fb.avgDelta<=-1.5 && !recLow && !recMid){ factor*=1.1; reasons.push(`letzte Einheiten fielen leichter als erwartet (Ø ${signed(fb.avgDelta)} RPE)`); }
  if(r.level.id==="low"){ factor*=.85; reasons.push("Tagesform niedrig"); easyUntil = addDays(todayKey(), 1); }
  if(recLow){
    factor*=.85; limitIntensity = true;
    reasons.push([rec.sleepAvg!=null ? `Schlaf Ø ${fmtNum(rec.sleepAvg)} h` : null, rec.sleepDebt>=3 ? `${fmtNum(rec.sleepDebt)} h Schlafdefizit` : null,
      rec.energyAvg!=null ? `Energie Ø ${Math.round(rec.energyAvg)} %` : null].filter(Boolean).join(", ") + " in den letzten 7 Tagen — Intensität begrenzt");
  } else if(recMid && (rec.sleepDebt>=3 || (rec.energyTrend!=null && rec.energyTrend<=-10))){
    factor*=.93;
    reasons.push(rec.sleepDebt>=3 ? `leichtes Schlafdefizit (${fmtNum(rec.sleepDebt)} h in 7 Tagen)` : `Energie unter deinem Normalniveau (${signed(rec.energyTrend,0)} %-Punkte)`);
  }
  return { factor:+factor.toFixed(2), reasons, fb, r, rec, limitIntensity, easyUntil };
}

function niceStep(r){ const p=10**Math.floor(Math.log10(r||1)); const m=r/p; return (m<=1?1:m<=2?2:m<=5?5:10)*p; }
function formGauge(tsb){
  const MIN=-40, MAX=35, cx=110, cy=108, r=88;
  const clamp = (v)=>Math.min(MAX, Math.max(MIN, v));
  const ang = (v)=> Math.PI * (1 - (clamp(v)-MIN)/(MAX-MIN));
  const pt = (v)=> [cx + r*Math.cos(ang(v)), cy - r*Math.sin(ang(v))];
  const arc = (a,b)=>{ const [x1,y1]=pt(a), [x2,y2]=pt(b); return `M${x1.toFixed(1)} ${y1.toFixed(1)} A${r} ${r} 0 0 1 ${x2.toFixed(1)} ${y2.toFixed(1)}`; };
  const segs = [[-40,-30,"var(--warn)"],[-30,-10,"var(--good)"],[-10,5,"var(--faint)"],[5,25,"var(--info)"],[25,35,"var(--c-rolle)"]];
  const cur = formStatus(tsb);
  let s = `<svg viewBox="0 0 220 124" role="img" aria-label="Form ${fmtNum(tsb)}">`;
  segs.forEach(([a,b,c])=>{
    const on = c===cur.color;
    s += `<path d="${arc(a+0.7,b-0.7)}" style="fill:none;stroke:${c};stroke-width:${on?14:10};opacity:${on?1:.35}"/>`;
  });
  const [mx,my] = pt(tsb);
  s += `<circle cx="${mx}" cy="${my}" r="9" style="fill:var(--surface);stroke:var(--ink);stroke-width:3"/>`;
  s += `<text x="${cx}" y="${cy-20}" text-anchor="middle" class="num" style="font-size:40px;font-weight:750;fill:var(--ink)">${signed(tsb)}</text>`;
  s += `<text x="${cx}" y="${cy+2}" text-anchor="middle" style="font-size:12px;font-weight:600;fill:var(--sub)">Form (TSB)</text>`;
  return s + `</svg>`;
}
const svgText = (x, y, t, anchor="middle") => `<text x="${x}" y="${y}" text-anchor="${anchor}" style="font-size:10px;fill:var(--faint)">${t}</text>`;

    if(a.ftp!==prev){ hist.push({ date:a.date, v:a.ftp }); prev=a.ftp; }
  });
  const step = hist.sort((a,b)=>a.date<b.date?-1:1).filter((h,i,arr)=>i===0 || h.v!==arr[i-1].v);
  const eftp = currentActivities().filter(a=>a.eftp).map(a=>({ date:a.date, v:Math.round(a.eftp) }));
  return { step, eftp };
}
function drawFtp(el){
  const { step, eftp } = ftpSeries();
  if(!step.length && !eftp.length){ el.innerHTML = `<p class="muted">Noch kein Verlauf — trag deine FTP in den Einstellungen ein oder synchronisiere mit intervals.icu.</p>`; return; }
  const all = [...step, ...eftp], tk = todayKey();
  const minD = all.reduce((m,p)=>p.date<m?p.date:m, addDays(tk,-30)), span = Math.max(1, (fromKey(tk)-fromKey(minD))/864e5);
  const vals = all.map(p=>p.v), lo = Math.min(...vals)*0.92, hi = Math.max(...vals)*1.06;
  const W = Math.max(280, el.clientWidth), H = 180, pl=36, pr=10, pt=10, pb=22;
  const x = (k)=> pl + (fromKey(k)-fromKey(minD))/864e5/span*(W-pl-pr);
  const y = (v)=> H-pb - (v-lo)/(hi-lo||1)*(H-pb-pt);
  let s = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">`;
  const st = niceStep((hi-lo)/3);
  for(let v=Math.ceil(lo/st)*st; v<=hi; v+=st) s += `<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--line)"/>` + svgText(pl-6, y(v)+3.5, v, "end");
  s += svgText(pl, H-5, fmtShort(minD).split(", ")[1], "start") + svgText(W-pr, H-5, "Heute", "end");
  eftp.forEach(p=>{ s += `<circle cx="${x(p.date)}" cy="${y(p.v)}" r="3" style="fill:var(--accent);opacity:.45"/>`; });
  if(step.length){
    let d = `M${x(step[0].date)},${y(step[0].v)}`;
    step.slice(1).forEach(p=>{ d += ` H${x(p.date)} V${y(p.v)}`; });
    d += ` H${x(tk)}`;
    s += `<path d="${d}" style="fill:none;stroke:var(--thr);stroke-width:2.4;stroke-linejoin:round"/>`;
    s += `<circle cx="${x(tk)}" cy="${y(step[step.length-1].v)}" r="4.5" style="fill:var(--thr);stroke:var(--surface);stroke-width:2"/>`;
  }
  el.innerHTML = s + `</svg>`;
}
// Schlaf (Balken, Stunden) + Energie (Linie, 0–100 %) pro Kalendertag
function drawRecovery(el){
  const days = Number(el.dataset.days)||14, pre = el.dataset.prefix||"rc", compact = days<=14;
  const byDay = Object.fromEntries(wellnessRows().map(d=>[d.day, d])), scale = energyScale(), need = sleepNeed();
  const data = Array.from({length:days}, (_,i)=>{ const k=addDays(todayKey(), i-days+1), d=byDay[k];
    return { k, h:sleepH(d), score:d ? d.sleepScore : null, e:d ? energyPct(d.energy, scale) : null, raw:d ? d.energy : null }; });
  const W = Math.max(260, el.clientWidth), H = compact ? 130 : 210, pl = compact ? 8 : 30, pr = compact ? 8 : 30, pt=10, pb=20;
  const xw=W-pl-pr, slot=xw/days, bw=Math.max(2, Math.min(18, slot*.62));
  const x = (i)=> pl + slot*(i+.5);
  const maxH = Math.max(10, need+1, ...data.map(d=>d.h||0));
  const yH = (h)=> H-pb - h/maxH*(H-pb-pt), yE = (p)=> H-pb - p/100*(H-pb-pt);
  let s = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Schlaf und Energie der letzten ${days} Tage">`;
  if(!compact) for(let h=0; h<=maxH; h+=2) s += `<line x1="${pl}" x2="${W-pr}" y1="${yH(h)}" y2="${yH(h)}" style="stroke:var(--line)"/>` + svgText(pl-6, yH(h)+3.5, `${h}h`, "end");
  if(!compact) [0,50,100].forEach(p=>{ s += `<text x="${W-pr+6}" y="${yE(p)+3.5}" style="font-size:10px;fill:var(--energy)">${p}%</text>`; });
  data.forEach((d,i)=>{ if(!d.h) return;
    const c = d.h>=need ? "var(--sleep)" : d.h>=need-1 ? "color-mix(in srgb, var(--sleep) 55%, transparent)" : "var(--warn)";
    s += `<rect x="${(x(i)-bw/2).toFixed(1)}" y="${yH(d.h).toFixed(1)}" width="${bw.toFixed(1)}" height="${(H-pb-yH(d.h)).toFixed(1)}" rx="${Math.min(3,bw/2)}" style="fill:${c}"/>`; });
  s += `<line x1="${pl}" x2="${W-pr}" y1="${yH(need)}" y2="${yH(need)}" style="stroke:var(--sleep);stroke-width:1;stroke-dasharray:4 3;opacity:.7"/>`;
  s += `<text x="${W-pr-2}" y="${yH(need)-4}" text-anchor="end" style="font-size:10px;font-weight:650;fill:var(--sleep);paint-order:stroke;stroke:var(--surface);stroke-width:3px">Bedarf ${fmtNum(need, need%1?1:0)} h</text>`;
  // Energie-Linie, Lücken unterbrechen die Linie
  let seg=[]; const flush=()=>{ if(seg.length>1) s += `<polyline points="${seg.join(" ")}" style="fill:none;stroke:var(--energy);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round"/>`; seg=[]; };
  data.forEach((d,i)=>{ if(d.e==null) flush(); else seg.push(`${x(i).toFixed(1)},${yE(d.e).toFixed(1)}`); }); flush();
  data.forEach((d,i)=>{ if(d.e!=null && (compact || days<=42)) s += `<circle cx="${x(i).toFixed(1)}" cy="${yE(d.e).toFixed(1)}" r="${compact?2.6:2.2}" style="fill:var(--energy);stroke:var(--surface);stroke-width:1.5"/>`; });
  const every = Math.max(1, Math.ceil(days / (W<520 ? 6 : compact ? 14 : 10)));
  data.forEach((d,i)=>{ if((days-1-i)%every===0) s += svgText(x(i), H-5, compact ? WEEKDAYS[dow(fromKey(d.k))] : fmtMMDD(d.k.slice(5))); });
  s += `<line id="${pre}-xl" y1="${pt}" y2="${H-pb}" style="display:none;stroke:var(--line-strong);stroke-dasharray:3 3"/>`;
  el.innerHTML = s + `</svg>`;

  const last = data.map((d,i)=>[d,i]).filter(([d])=>d.h||d.e!=null).pop();
  const show = (i)=>{ const d=data[i]; if(!d) return;
    setText(`${pre}-h`, d.h ? fmtDur(d.h*60) : "–"); setText(`${pre}-s`, d.score!=null ? Math.round(d.score) : "–");
    setText(`${pre}-e`, fmtEnergy(d.raw, scale)); setText(`${pre}-d`, d.k===todayKey() ? "Heute" : fmtShort(d.k)); };
  if(last) show(last[1]);
  const xl = el.querySelector(`#${pre}-xl`);
  el.onpointermove = (e)=>{ const r=el.getBoundingClientRect(); const i=Math.min(days-1, Math.max(0, Math.floor((e.clientX-r.left-pl)/slot)));
    xl.style.display=""; xl.setAttribute("x1",x(i)); xl.setAttribute("x2",x(i)); show(i); };
  el.onpointerleave = ()=>{ xl.style.display="none"; if(last) show(last[1]); };
}

function dragTemplate(e, tid){ e.dataTransfer.setData("text/plain", JSON.stringify({ t:tid })); e.dataTransfer.effectAllowed="copy"; }
function dragWorkout(e, id, key){ e.dataTransfer.setData("text/plain", JSON.stringify({ w:id, k:key })); e.dataTransfer.effectAllowed="move"; }
function dragOverDay(e){ e.preventDefault(); e.currentTarget.classList.add("drop"); }
function dragLeaveDay(e){ if(!e.currentTarget.contains(e.relatedTarget)) e.currentTarget.classList.remove("drop"); }
function dropOnDay(e, key){
  e.preventDefault(); e.currentTarget.classList.remove("drop");
  let d; try { d = JSON.parse(e.dataTransfer.getData("text/plain")); } catch { return; }
  if(d.t){
    const t = allTemplates().find(x=>x.id===d.t); if(!t) return;
    addWorkout(key, workoutFromTemplate(t, key)); render(); toast(`„${t.title}“ am ${fmtShort(key)} eingeplant`);
  } else if(d.w!=null){ moveWorkout(d.w, d.k, key); render(); }
}

function seasonCard(){
  const s = seasonInfo();
  if(!s) return `<section class="card" style="margin-top:14px"><div class="empty"><span class="tile lg">${icon("trophy",22)}</span>
    <div style="flex:1"><b>Saisonziel festlegen</b><p>Mit Wettkampfdatum werden Phasen (Grundlage → Aufbau → Spitze → Tapering) und eine Form-Prognose für den Renntag berechnet.</p></div>
    <button class="btn secondary sm" onclick="openSettings()">Festlegen</button></div></section>`;
  const WEEK = 7*864e5, race = s.raceDate, today = fromKey(todayKey());
  const start = new Date(Math.min(today, race - 20*WEEK)), span = Math.max(1, race - start);
  const bounds = [[start, race-16*WEEK], [race-16*WEEK, race-8*WEEK], [race-8*WEEK, race-2*WEEK], [race-2*WEEK, race]];
  const segs = SEASON_PHASES.map((p,i)=>{ const a=Math.max(bounds[i][0], start), b=Math.max(a, bounds[i][1]); return { p, w:(b-a)/span*100 }; }).filter(x=>x.w>0);
  const marker = Math.min(100, Math.max(0, (today-start)/span*100));
  const proj = s.days>=0 ? projectFitness(s.date) : [];
  const rd = proj.find(p=>p.day===s.date), rfs = rd ? formStatus(rd.tsb) : null;
  const inTarget = rd && rd.tsb>=5 && rd.tsb<=25;
  return `<section class="card" style="margin-top:14px">
    <div class="card-head"><div><h2 style="display:flex; align-items:center; gap:8px">${icon("trophy",18,2.1)}${esc(s.name||"Wettkampf")}</h2>
      <div class="muted" style="font-size:13px; margin-top:2px">${fmtLong(s.date)}${s.type?` · ${esc(s.type)}`:""}</div></div>
      <span class="pill" style="color:${s.phase.color}">${s.days<0 ? "Vorbei" : s.days===0 ? "Heute!" : `Noch ${s.weeks} Wochen`} · ${s.phase.label}</span></div>
    ${s.days>=0 ? `<div class="season-wrap"><div class="season-track">${segs.map(x=>`<i style="width:${x.w}%; background:${x.p.color}"></i>`).join("")}</div>
      <div class="season-marker" style="left:${marker}%" title="Heute"></div></div>
      <div class="season-labels">${segs.map(x=>`<span style="width:${x.w}%">${x.p.label}</span>`).join("")}</div>` : ""}
    <p class="muted" style="margin-top:12px">${s.phase.note}</p>
    ${rd ? `<div class="tiles">
        <div class="mini"><div class="k">Fitness am Renntag</div><div class="v num">${fmtNum(rd.ctl,0)} <small style="font-size:12px;color:var(--sub)">CTL</small></div></div>
        <div class="mini"><div class="k">Form am Renntag</div><div class="v num" style="color:${rfs.color}">${signed(rd.tsb)}</div></div>
        <div class="mini"><div class="k">Zustand</div><div class="v" style="color:${rfs.color}">${rfs.label}</div></div>
      </div>
      <p class="muted" style="font-size:12px; margin-top:10px">${inTarget ? "✓ Die Prognose liegt im Zielbereich (TSB +5 bis +25) — frisch, ohne Fitness zu verlieren." : rd.tsb>25 ? "Ziel am Renntag: TSB +5 bis +25 — ein kürzeres oder sanfteres Tapering reicht." : "Ziel am Renntag: TSB +5 bis +25 — Tapering verlängern oder den Umfang davor stärker reduzieren."}
        Prognose aus deinen geplanten Einheiten und einem phasengerechten Modell für die Zeit danach — kein Ersatz für echte Trainingsdaten.</p>` : ""}
  </section>`;
}

function renderModal(){
  let overlay = document.getElementById("overlay");
  if(!state.modal){ if(overlay) overlay.remove(); document.body.style.overflow=""; return; }
  if(!overlay){
    overlay = document.createElement("div");
    overlay.id="overlay"; overlay.className="overlay";
    overlay.onclick = (e)=>{ if(e.target===overlay) closeModal(); };
    overlay.innerHTML = `<div class="sheet" role="dialog" aria-modal="true"></div>`;
    document.body.appendChild(overlay);
    document.body.style.overflow="hidden";
  }
  overlay.firstElementChild.innerHTML = `<div class="grabber"></div>${modalContent()}`;
}

  const m = state.modal;

}

/* ---------- Push-Erinnerungen ---------- */
function urlB64ToUint8Array(b64){
  const pad = "=".repeat((4 - b64.length % 4) % 4);
  const raw = atob((b64 + pad).replace(/-/g, "+").replace(/_/g, "/"));
  return Uint8Array.from([...raw].map(c=>c.charCodeAt(0)));
}
async function toggleReminders(on){
  try {
    if(!("serviceWorker" in navigator) || !("PushManager" in window) || !("Notification" in window))
      throw new Error("Push wird hier nicht unterstützt. Auf dem iPhone: App zum Home-Bildschirm hinzufügen und von dort öffnen.");
    const reg = await navigator.serviceWorker.ready;
    if(on){
      if(await Notification.requestPermission() !== "granted") throw new Error("Benachrichtigungen wurden nicht erlaubt.");
      const { publicKey } = await fetchJSON(`${API}/push-subscribe`);
      if(!publicKey) throw new Error("VAPID_PUBLIC_KEY ist auf Netlify nicht gesetzt (siehe README).");
      const sub = await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey:urlB64ToUint8Array(publicKey) });
      await fetchJSON(`${API}/push-subscribe`, { method:"POST", headers:JSON_H, body:JSON.stringify({ subscription:sub.toJSON() }) });
      toast("Erinnerung aktiviert");
    } else {
      const sub = await reg.pushManager.getSubscription();
      if(sub){ await fetch(`${API}/push-subscribe`, { method:"DELETE", headers:JSON_H, body:JSON.stringify({ endpoint:sub.endpoint }) }).catch(()=>{}); await sub.unsubscribe(); }
      toast("Erinnerung deaktiviert");
    }
    state.settings.reminders = on; persistSettings();

  const zone = low ? "z1" : "z2", duration = Math.max(20, Math.round(w.duration*(low?.6:.8)/5)*5);
  const patch = { zone, duration, load:estLoad(duration, zone), eased:true,

    notes: [w.notes, `Wegen Tagesform angepasst — ursprünglich ${fmtDur(w.duration)} ${zoneById(w.zone).label}.`].filter(Boolean).join("\n") };

async function wizardGenerate(useClaude){
  const dayList = weekDays().map(d=>({date:d, key:iso(d), hours:Number(state.wizardHours[iso(d)]||0)}));
  const phase = trainingPhase(CURR().ctl);
  const adj = planAdjustments();

  if(!useClaude){
    state.wizardSource = "rules";
    state.wizardResult = generateAutoPlan(dayList, CURR().ctl, adj);
    state.wizardStep = 3;
    renderModal();
    return;
  }

  state.wizardSource = "claude";
  state.wizardLoading = true; state.wizardError = null; state.wizardStep = 3;
  renderModal();

  try{
    const lastWeek = weekStats(weekDaysOf(fromKey(addDays(iso(state.weekStart), -7))));
    const payload = {
      days: dayList.map(d=>({ key:d.key, hours:d.hours, weather: getWeather(d.key) })),
      ctl: CURR().ctl, atl: CURR().atl, tsb: CURR().tsb,
      phaseLabel: phase.label, phaseNote: phase.note,
      season: seasonPayload(),
      readiness: { score:adj.r.score, level:adj.r.level.label, factors:adj.r.factors.map(f=>`${f.label} ${f.value}`) },
      recovery: recoveryPayload(),
      feedback: adj.fb,
      lastWeek: { planned:lastWeek.n, done:lastWeek.done, compliance:lastWeek.compliance ?? 0 },
    };
    const data = await fetchJSON(`${API}/generate-plan`, { method:"POST", headers:JSON_H, body: JSON.stringify(payload) });
    state.wizardResult = enrichClaudeWorkouts(data.workouts);
  } catch(e){
    state.wizardError = "Claude konnte keinen Plan erstellen: " + e.message;
  }
  state.wizardLoading = false;
  if(state.modal && state.modal.type==="wizard") renderModal();
}

// Reichert Claudes Roh-Vorschläge (dateKey/discipline/title/duration/zone/goal)
// mit den deterministischen Teilen an, die schon für den regelbasierten Planer existieren.
function enrichClaudeWorkouts(raw){
  const workouts = (raw||[]).map(w=>{
    const weather = getWeather(w.dateKey);
    const discipline = DISCIPLINES[w.discipline] ? w.discipline : "sonstiges";
    const duration = Number(w.duration)||30;
    const full = {
      id: Date.now()+Math.random(), done:false,
      dateKey: w.dateKey, discipline, title: w.title, duration, zone: w.zone,
      load: estLoad(duration, w.zone), goal: w.goal,
      weatherNote: weather ? `${Math.round(weather.high)}°C, Regenwahrscheinlichkeit ${weather.precip}%` : "Keine Vorhersage verfügbar.",
    };
    Object.assign(full, routePatch(discipline, duration));
    if(discipline==="rolle") full.erg = defaultErg(w.zone, duration);
    return full;
  });
  const totalLoad = workouts.reduce((s,w)=>s+w.load,0);
  const safeLoad = CURR().ctl*7*1.15;
  const warning = totalLoad > safeLoad*1.25 ? `Geplante Wochenlast (${totalLoad}) liegt deutlich über einem verträglichen Aufbau-Tempo (~${Math.round(safeLoad)}).` : null;
  return { workouts, warning, totalLoad, safeLoad:Math.round(safeLoad) };
}

const FIT_HELP = "In OnelapFit: Ich → Aktivitäten → Fahrt öffnen → Teilen → „Share Fit“ → „In Dateien sichern“. Dann hier die Datei auswählen. Schneller: Kurzbefehl einrichten (Einstellungen → Integrationen).";
const FIT_OK = /\.(fit|fit\.gz|gpx|gpx\.gz|tcx|tcx\.gz|zip)$/i;
// Kein accept-Filter: iOS kennt keinen MIME-Typ für .fit und würde die Dateien sonst ausgrauen
function pickFit(stubIdx=null){
  // Im DOM verankert, weil ältere iOS-Versionen den Dateidialog sonst nicht öffnen
  const inp = document.createElement("input"); inp.type = "file"; inp.style.display = "none";
  inp.onchange = () => { if(inp.files && inp.files[0]) uploadFit(inp.files[0], stubIdx); inp.remove(); };
  document.body.appendChild(inp);
  inp.click();
}
function bufToB64(buf){
  const b = new Uint8Array(buf); let s = "";
  for(let i=0; i<b.length; i+=0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i+0x8000));
  return btoa(s);
}
async function gzip(buf){
  if(typeof CompressionStream === "undefined") return null;
  try { return await new Response(new Blob([buf]).stream().pipeThrough(new CompressionStream("gzip"))).arrayBuffer(); } catch { return null; }
}
async function uploadFit(file, stubIdx=null){
  if(!FIT_OK.test(file.name)){ toast("Bitte eine .fit-Datei auswählen", "err"); return; }
  if(state.uploading) return;
  const stub = stubIdx!=null ? currentActivities()[stubIdx] : null;
  const link = stub && MATCH.aw ? MATCH.aw.get(stub) : null;
  state.uploading = true; toast("FIT-Datei wird hochgeladen …");
  try {
    let buf = await file.arrayBuffer(), filename = file.name;
    // .fit vor dem Upload komprimieren (intervals.icu nimmt .fit.gz) — hält die Anfrage klein
    if(/\.(fit|gpx|tcx)$/i.test(filename)){ const gz = await gzip(buf); if(gz && gz.byteLength < buf.byteLength){ buf = gz; filename += ".gz"; } }
    if(buf.byteLength > 4.2*1024*1024) throw new Error("Datei ist zu groß (max. ca. 4 MB)");
    const res = await fetchJSON(`${API}/intervals-upload`, { method:"POST", headers:JSON_H, body: JSON.stringify({
      filename, data: bufToB64(buf),
      name: link ? link.w.title : undefined,
      pairedEventId: link && link.w.eventId!=null ? link.w.eventId : (stub && stub.pairedEventId!=null ? stub.pairedEventId : undefined),
      stubId: stub ? stub.id : undefined,
    }) });
    if(res.stubRemains && confirm("Hochgeladen ✓\n\nDer leere Strava-Eintrag dieser Fahrt ist in intervals.icu noch vorhanden — dann zählt die Trainingslast doppelt. Strava-Eintrag entfernen?")){
      await fetchJSON(`${API}/intervals-upload?activityId=${encodeURIComponent(stub.id)}`, { method:"DELETE" })
        .catch(e=>toast("Strava-Eintrag konnte nicht entfernt werden: " + e.message, "err"));
    }
    if(state.modal && state.modal.type==="activity") closeModal();
    toast("Fahrt hochgeladen — wird synchronisiert");
    // intervals.icu analysiert die Datei asynchron → kurz warten, dann neu laden
    setTimeout(()=>syncFromIntervals(false), 2500);
  } catch(e) {
    toast("Upload fehlgeschlagen: " + e.message, "err");
  }
  state.uploading = false;
}

async function pushWorkout(key, id, silent=false){
  const w = findWorkout(key, id); if(!w) return false;
  try {
    const data = await fetchJSON(`${API}/intervals-push-event`, { method:"POST", headers:JSON_H,
      body: JSON.stringify({ dateKey:key, title:w.title, discipline:w.discipline, duration:w.duration, description:intervalsDescription(w), eventId:w.eventId||null }) });
    if(data && data.id!=null && data.id!==w.eventId) updateWorkout(key, id, { eventId:data.id });
    if(!silent) toast(w.eventId ? "In intervals.icu aktualisiert" : "An intervals.icu gesendet");
    if(state.modal && state.modal.type==="detail") renderModal();
    return true;
  } catch(e) {
    if(!silent) toast("Senden fehlgeschlagen: " + e.message, "err");
    return false;
  }
}

  if(!list.length){ toast("Keine anstehenden Einheiten in dieser Woche"); return; }
  toast(`Sende ${list.length} Einheiten …`);
