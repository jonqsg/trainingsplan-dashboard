  for(const [k,id] of list){ if(await pushWorkout(k, id, true)) ok++; }
  render();
  toast(ok===list.length ? `${ok} Einheiten an intervals.icu gesendet` : `${ok} von ${list.length} gesendet — Rest fehlgeschlagen`, ok===list.length ? "" : "err");
}
function downloadErg(id, dateKey){
  const w = findWorkout(dateKey, id);
  if(w && w.erg) downloadFile(`${w.title.replace(/\s+/g,"_")}.erg`, buildErg(w.erg), "text/plain");
}
function downloadGpx(id, dateKey){
  const w = findWorkout(dateKey, id);
  if(w && w.gpx && w.gpx.real){ const route = genRealRoute(w.gpx.km, w.discipline); downloadFile(`${w.title.replace(/\s+/g,"_")}.gpx`, routeToGpx(route, w.title), "application/gpx+xml"); }
}
function onGpxUpload(evt, id, dateKey){
  const f = evt.target.files[0]; if(!f) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    const summary = parseGpx(reader.result);
    if(summary){ updateWorkout(dateKey, id, { gpx: {...summary, real:false} }); render(); toast("GPX übernommen"); }
    else toast("GPX-Datei konnte nicht gelesen werden", "err");
  };
  reader.readAsText(f);
}
function toggleDone(id, dateKey){
  const w=findWorkout(dateKey, id); if(!w) return;
  updateWorkout(dateKey, id, {done: !w.done}); state.modal=null; render();
  if(!w.done) openFeedback(id, dateKey);
}
function deleteWorkout(id, dateKey){
  const w = findWorkout(dateKey, id);
  if(!w || !confirm(`„${w.title}“ wirklich löschen?${w.eventId ? " Das Event in intervals.icu wird ebenfalls entfernt." : ""}`)) return;
  if(w.eventId) fetch(`${API}/intervals-push-event?eventId=${encodeURIComponent(w.eventId)}`, { method:"DELETE" }).catch(()=>{});
  removeWorkout(dateKey, id); state.modal=null; render(); toast("Workout gelöscht");
}

/* ---------- Wochenrückblick ---------- */
async function generateReview(wk){
  const days = weekDaysOf(fromKey(wk)), ws = weekStats(days);
  state.reviewLoading = wk; render();
  try {
    const payload = {
      week: wk, season: seasonPayload(),
      fitness: { ctlStart: WEEKAGO().ctl, ctlEnd: CURR().ctl, tsb: CURR().tsb },
      stats: { planned:ws.n, done:ws.done, compliance:ws.compliance ?? 0, load:ws.load, lowPct: ws.min ? Math.round(ws.band.low/ws.min*100) : 0 },
      days: days.map(d=>{ const k=iso(d); return {
        date: k,
        planned: (state.plan[k]||[]).map(w=>({ title:w.title, discipline:w.discipline, zone:w.zone, duration:w.duration, done:isDone(w),
          actualMin:(MATCH.wm.get(w.id)||{}).min || null, rpe:w.rpe||null, feel:w.feel||null, feedback:w.feedback||"" })),
        unplanned: (MATCH.unplanned[k]||[]).map(a=>({ name:a.name, min:a.min, km:a.km, load:a.load })),
        checkin: (state.journal.checkins||{})[k] || null,
        wellness: (()=>{ const w=wellnessRows().find(r=>r.day===k); return w && hasRecoveryData(w) ? { sleepH:sleepH(w) ? +sleepH(w).toFixed(1) : null,
          sleepScore:w.sleepScore ?? null, energyPct:energyPct(w.energy) } : null; })(),
      }; }),
      recovery: (()=>{ const rows=days.map(d=>wellnessRows().find(r=>r.day===iso(d))).filter(Boolean);
        const sh=mean(rows.map(sleepH)), en=mean(rows.map(r=>energyPct(r.energy)));
        return sh==null && en==null ? null : { sleepNeedH:sleepNeed(), sleepAvgH:sh!=null ? +sh.toFixed(1) : null, energyAvgPct:en!=null ? Math.round(en) : null }; })(),
    };
    const res = await fetchJSON(`${API}/weekly-review`, { method:"POST", headers:JSON_H, body:JSON.stringify(payload) });
    state.journal.reviews = { ...(state.journal.reviews||{}), [wk]: { ...res, createdAt:new Date().toISOString() } };
    persistJournal();
  } catch(e) {
    toast("Rückblick fehlgeschlagen: " + e.message, "err");
  }
  state.reviewLoading = null; render();
}

/* ---------- Export / Import ---------- */
function exportData(){
  const payload = { plan:state.plan, settings:state.settings, library:state.library, journal:state.journal, exportedAt:new Date().toISOString() };
  downloadFile("trainingsplan-export.json", JSON.stringify(payload, null, 2), "application/json");
}
function importData(evt){
  const f = evt.target.files[0]; if(!f) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const data = JSON.parse(reader.result);
      if(data.plan){ state.plan = data.plan; persistPlan(); }
      if(data.settings){ state.settings = { ...DEFAULT_SETTINGS, ...data.settings }; persistSettings(); }
      if(Array.isArray(data.library)){ state.library = data.library; persistLibrary(); }
      if(data.journal){ state.journal = { checkins:{}, reviews:{}, ...data.journal }; persistJournal(); }
      state.modal=null; render();
      toast("Import erfolgreich");
    } catch(e){ toast("Datei konnte nicht gelesen werden — ist es die Export-JSON?", "err"); }
  };
  reader.readAsText(f);
  evt.target.value = "";
}

/* ================= Toast ================= */
function toast(msg, kind=""){
  let t = document.getElementById("toast");
  if(!t){ t=document.createElement("div"); t.id="toast"; t.setAttribute("role","status"); document.body.appendChild(t); }
  t.textContent = msg; t.className = `toast ${kind}`;
  clearTimeout(t._h);
  requestAnimationFrame(()=>{
    t.className = `toast show ${kind}`;
    t._h = setTimeout(()=>{ t.className = `toast ${kind}`; }, 2800);
  });
}

if("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(e=>console.warn("Service Worker nicht registriert:", e));
loadState();
